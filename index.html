async function initGallery(p,index){
  const g=document.getElementById(`gallery-${index}`);if(!g)return;
  const main=g.querySelector('.photo'),ph=g.querySelector('.placeholder'),prev=g.querySelector('.prev'),next=g.querySelector('.next'),count=g.querySelector('.gallery-count');
  const m=p.image.match(/^(.*?)(\.[^.\/]+)$/);if(!m){ph.textContent=`Photo unavailable - ${p.name}`;return}
  const exact=p.image, numbered=[`${m[1]}-1${m[2]}`,`${m[1]}-2${m[2]}`,`${m[1]}-3${m[2]}`];
  let images=[],current=0,testedTo=0,numberedMode=false;
  if(await loadImage(numbered[0])){images=[numbered[0]];numberedMode=true;testedTo=1}
  else if(await loadImage(exact)){images=[exact];testedTo=3}
  else{ph.textContent=`Photo unavailable - ${p.name}`;return}
  async function ensureNext(){
    if(!numberedMode||testedTo>=3)return false;
    const candidate=numbered[testedTo];testedTo++;
    if(await loadImage(candidate)){images.push(candidate);return true}
    testedTo=3;return false
  }
  function updateControls(){
    count.textContent=`${current+1} / ${testedTo>=3?images.length:Math.min(3,images.length+1)}`;
    count.hidden=false;prev.hidden=images.length<=1&&current===0;next.hidden=!numberedMode||(testedTo>=3&&current>=images.length-1)
  }
  function show(){main.src=images[current];main.style.display='block';ph.style.display='none';updateControls();main.onclick=()=>openLB(images,current,p.name);main.tabIndex=0;main.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLB(images,current,p.name)}}}
  prev.onclick=()=>{if(images.length>1){current=(current-1+images.length)%images.length;show()}};
  next.onclick=async()=>{if(current<images.length-1){current++;show();return}if(await ensureNext()){current++;show()}else{updateControls()}};
  show()
}
function matchStatus(p){const v=statusFilter.value;if(v==='current')return ['available','upcoming','reserved'].includes(p.status);return p.status===v}function render(){const term=search.value.trim().toLowerCase();let list=publicProducts.filter(p=>`${p.name} ${p.description}`.toLowerCase().includes(term)&&(category.value==='All'||p.category===category.value)&&matchStatus(p));if(sort.value==='low')list.sort((a,b)=>a.price-b.price);if(sort.value==='high')list.sort((a,b)=>b.price-a.price);if(sort.value==='name')list.sort((a,b)=>a.name.localeCompare(b.name));const counts={available:0,upcoming:0,reserved:0,sold:0};publicProducts.forEach(p=>{if(counts[p.status]!==undefined)counts[p.status]++});summary.textContent=`${list.length} shown | ${counts.available} available now | ${counts.upcoming} upcoming | ${counts.reserved} reserved | ${counts.sold} sold`;if(!list.length){productsEl.innerHTML='<div class="empty"><h2>No items found</h2><p>Try another filter.</p></div>';return}productsEl.innerHTML=list.map((p,i)=>{const msg=encodeURIComponent(`Hello ${contactName}, I am interested in ${p.name}, listed at KES ${Number(p.price).toLocaleString('en-KE')}${p.quantity>1?' per unit':''}. Is it still available?`);const ribbon=p.status==='sold'?'<div class="ribbon sold">SOLD</div>':p.status==='reserved'?'<div class="ribbon reserved">RESERVED</div>':p.status==='upcoming'?'<div class="ribbon upcoming">COMING SOON</div>':'';const action=['available','upcoming'].includes(p.status)?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${whatsappNumber}?text=${msg}">Contact Christine on WhatsApp</a>`:`<div class="status-button">This item is ${esc(p.status)}</div>`;const availability=p.status==='upcoming'?`<div class="tentative">Tentative availability: ${esc(p.availability)}</div>`:(p.availability&&p.availability.toLowerCase()!=='now'?`<div>Availability: ${esc(p.availability)}</div>`:'');return `<article class="card ${p.status==='sold'?'sold':''}">${ribbon}<div id="gallery-${i}" class="gallery"><img class="photo" loading="lazy" decoding="async" alt="${esc(p.name)}"><div class="placeholder">Loading photo...</div><button class="gallery-nav prev" type="button" hidden>‹</button><button class="gallery-nav next" type="button" hidden>›</button><span class="gallery-count" hidden></span></div><div class="body"><div class="category">${esc(p.category)}</div><h2>${esc(p.name)}</h2><p class="desc">${esc(p.description)}</p><div class="meta">${p.quantity>1?`<div class="qty">Quantity available: ${p.quantity}</div>`:''}${availability}</div><div class="price">KES ${Number(p.price).toLocaleString('en-KE')} ${p.quantity>1?'<span class="per-unit">per unit</span>':''}</div>${action}</div></article>`}).join('');list.forEach((p,i)=>initGallery(p,i))}
[search,category,statusFilter,sort].forEach(el=>el.addEventListener(el===search?'input':'change',render));clear.onclick=()=>{search.value='';category.value='All';statusFilter.value='current';sort.value='default';render()};render();
</script></body></html>
